<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Exercício 007</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator-card">
            <h1>🧮 Calculadora Inteligente Elisama</h1>
            <p class="subtitle">Insira dois números e veja os resultados</p>

            <!-- Área de Inputs -->
            <div class="input-group">
                <div class="input-field">
                    <label for="num1">🔢 Primeiro Número</label>
                    <input type="number" id="num1" placeholder="Ex: 15" step="any">
                </div>
                
                <div class="input-field">
                    <label for="num2">🔢 Segundo Número</label>
                    <input type="number" id="num2" placeholder="Ex: 7" step="any">
                </div>
            </div>

            <!-- Botão Calcular -->
            <button id="calcularBtn" class="calculate-btn">
                ⚡ Calcular
            </button>

            <!-- Mensagem de Erro -->
            <div id="errorMessage" class="error-message"></div>

            <!-- Área de Resultados -->
            <div id="resultados" class="results-area">
                <div class="result-item">
                    <span class="result-icon">➕</span>
                    <div class="result-content">
                        <h3>Soma</h3>
                        <p id="somaResult">Aguardando cálculo...</p>
                    </div>
                </div>

                <div class="result-item">
                    <span class="result-icon">✖️</span>
                    <div class="result-content">
                        <h3>Multiplicação</h3>
                        <p id="multiplicacaoResult">Aguardando cálculo...</p>
                    </div>
                </div>

                <div class="result-item comparison">
                    <span class="result-icon">🔍</span>
                    <div class="result-content">
                        <h3>Comparação</h3>
                        <p id="comparacaoResult">Aguardando cálculo...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
