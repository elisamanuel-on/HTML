<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora 4 Operações - Exercício 013</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🧮 Calculadora 4 Operações</h1>
            <p class="subtitle">Insira dois números e veja os resultados</p>

            <!-- Inputs -->
            <div class="input-group">
                <div class="input-field">
                    <label for="num1">Primeiro Número</label>
                    <input type="number" id="num1" placeholder="Insira um número" step="any">
                </div>
                
                <div class="input-field">
                    <label for="num2">Segundo Número</label>
                    <input type="number" id="num2" placeholder="Insira um número" step="any">
                </div>
            </div>

            <!-- Botão -->
            <button id="calcularBtn">Calcular</button>

            <!-- Mensagem de Erro -->
            <div id="erro" class="erro"></div>

            <!-- Resultados -->
            <div id="resultados" class="resultados-area">
                <div class="resultado-item">
                    <span class="resultado-icon">➕</span>
                    <div class="resultado-conteudo">
                        <h3>Soma</h3>
                        <p id="somaResult">Aguardando números...</p>
                    </div>
                </div>

                <div class="resultado-item">
                    <span class="resultado-icon">➖</span>
                    <div class="resultado-conteudo">
                        <h3>Subtração</h3>
                        <p id="subtracaoResult">Aguardando números...</p>
                    </div>
                </div>

                <div class="resultado-item">
                    <span class="resultado-icon">✖️</span>
                    <div class="resultado-conteudo">
                        <h3>Multiplicação</h3>
                        <p id="multiplicacaoResult">Aguardando números...</p>
                    </div>
                </div>

                <div class="resultado-item divisao">
                    <span class="resultado-icon">➗</span>
                    <div class="resultado-conteudo">
                        <h3>Divisão</h3>
                        <p id="divisaoResult">Aguardando números...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
